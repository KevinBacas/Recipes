# Configuration du dépôt : les choix explicites du client restent prioritaires.
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"

[agents]
enabled = true
# Threads ouverts, y compris terminés : libérer les places avant la revue.
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "high"
